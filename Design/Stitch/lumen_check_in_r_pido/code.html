<script>
  document.querySelectorAll('.valence-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.valence-btn').forEach(b => {
        b.classList.remove('active');
        b.querySelector('span:last-child').classList.remove('text-primary', 'font-medium');
        b.querySelector('span:last-child').classList.add('text-on-surface-variant');
      });
      btn.classList.add('active');
      const label = btn.querySelector('span:last-child');
      label.classList.remove('text-on-surface-variant');
      label.classList.add('text-primary', 'font-medium');
      document.getElementById('valence-label').textContent = btn.dataset.val;
    });
  });

  document.querySelectorAll('.focus-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.focus-chip').forEach(c => {
        c.className = 'focus-chip flex items-center gap-space-sm p-3 rounded-2xl bg-surface-container text-on-surface shadow-sm text-left active:scale-[0.98] transition-all';
        c.querySelector('span:last-child').className = 'font-label-sm text-label-sm text-on-surface-variant truncate';
      });
      chip.className = 'focus-chip active flex items-center gap-space-sm p-3 rounded-2xl bg-primary-container text-on-primary shadow-sm text-left active:scale-[0.98] transition-all';
      chip.querySelector('span:last-child').className = 'font-label-sm text-label-sm opacity-80 truncate';
    });
  });

  const energyPills = document.querySelectorAll('.energy-pill');
  energyPills.forEach((pill, idx) => {
    pill.addEventListener('click', () => {
      document.getElementById('energy-label').textContent = pill.dataset.label;
      energyPills.forEach((p, i) => {
        if (i <= idx) {
          p.className = 'energy-pill active h-3.5 rounded-full bg-secondary transition-all opacity-100 shadow-sm';
        } else {
          p.className = 'energy-pill h-3.5 rounded-full bg-surface-container-highest transition-all';
        }
      });
    });
  });

  document.querySelectorAll('.tag-pill').forEach(tag => {
    tag.addEventListener('click', () => {
      if (tag.classList.contains('active')) {
        tag.classList.remove('active', 'bg-primary-fixed', 'text-on-primary-fixed', 'bg-secondary-fixed', 'text-on-secondary-fixed');
        tag.classList.add('bg-surface-container', 'text-on-surface-variant');
      } else {
        tag.classList.add('active', 'bg-primary-fixed', 'text-on-primary-fixed');
        tag.classList.remove('bg-surface-container', 'text-on-surface-variant');
      }
    });
  });

  const submitBtn = document.getElementById('submit-checkin');
  submitBtn.addEventListener('click', () => {
    submitBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span> Salvo com carinho';
    submitBtn.classList.replace('bg-primary-container', 'bg-primary');
    setTimeout(() => {
      window.history.back();
    }, 600);
  });
</script></main></body></html>
